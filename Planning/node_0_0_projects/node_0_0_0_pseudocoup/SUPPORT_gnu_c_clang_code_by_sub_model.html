<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clang code covered</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #e2e0d9; --panel: #ffffff;
  --grid: #d3ebc9; --grid-edge: #3f8a2e;
  --reader: #cfe0f6; --reader-edge: #2f6db3;
  --filled: #e7dcf5; --filled-edge: #7b4bb3;
  --unmodelled: #f6d5cf; --unmodelled-edge: #b2402a;
  --said: #fff0b3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1b1a; --fg: #ecebe6; --muted: #a3a19a; --line: #34332f; --panel: #232321;
    --grid: #2b4426; --grid-edge: #7cc46a;
    --reader: #23384f; --reader-edge: #7aa9e6;
    --filled: #362a4a; --filled-edge: #b48ee6;
    --unmodelled: #4b2a23; --unmodelled-edge: #e2826c;
    --said: #4a3f12;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1b1a; --fg: #ecebe6; --muted: #a3a19a; --line: #34332f; --panel: #232321;
  --grid: #2b4426; --grid-edge: #7cc46a;
  --reader: #23384f; --reader-edge: #7aa9e6;
  --filled: #362a4a; --filled-edge: #b48ee6;
  --unmodelled: #4b2a23; --unmodelled-edge: #e2826c;
  --said: #4a3f12;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; line-height: 1.45; }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 3; }
header h1 { font-size: 1.1rem; margin: 0 0 6px 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; background: var(--panel); color: var(--fg); cursor: pointer; font-family: inherit; }
.swatch { width: 12px; height: 12px; border-radius: 3px; border-left: 4px solid; display: inline-block; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; background: var(--panel); color: var(--fg); padding: 4px 10px; font: inherit; font-size: 0.85rem; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.q { border: 1px solid var(--line); border-radius: 50%; width: 24px; height: 24px; background: var(--panel); color: var(--fg); cursor: pointer; font: inherit; font-size: 0.8rem; padding: 0; }
.pop { display: none; max-width: 640px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-top: 6px; font-size: 0.9rem; }
.pop.open { display: block; }
.muted { color: var(--muted); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 36%); }
main { padding: 10px 16px 96px 16px; min-width: 0; }
aside { border-left: 1px solid var(--line); padding: 12px 16px; position: sticky; top: var(--header-height, 110px); height: calc(100vh - var(--header-height, 110px)); overflow: auto; background: var(--panel); }
@media (max-width: 860px) {
  header { position: static; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 50vh; border-left: 0; border-top: 1px solid var(--line); z-index: 4; display: none; }
  aside.open { display: block; }
}
section.block { margin: 14px 0 26px 0; }
section.block h2 { font-size: 1.02rem; margin: 0 0 4px 0; }
.problems { margin: 0 0 6px 0; padding-left: 18px; font-size: 0.9rem; }
.op { font-family: ui-monospace, monospace; }
.op .n { font-family: system-ui, sans-serif; color: var(--muted); font-size: 0.8rem; }
.fn { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: var(--panel); overflow: hidden; }
.fn > summary { cursor: pointer; padding: 6px 10px; font-family: ui-monospace, monospace; font-size: 0.88rem; border-bottom: 1px solid var(--line); }
.code { overflow-x: auto; font-family: ui-monospace, monospace; font-size: 0.8rem; }
.ln { display: flex; white-space: pre; cursor: pointer; border-left: 5px solid transparent; }
.ln .no { color: var(--muted); min-width: 4.4em; text-align: right; padding-right: 10px; user-select: none; }
.ln .tx { padding-right: 16px; }
.ln:hover { outline: 1px solid var(--line); }
.ln.sel { outline: 2px solid var(--fg); }
.ln.grid { background: var(--grid); border-left-color: var(--grid-edge); }
.ln.reader { background: var(--reader); border-left-color: var(--reader-edge); }
.ln.both { background: linear-gradient(90deg, var(--grid) 0 50%, var(--reader) 50% 100%); border-left-color: var(--reader-edge); }
.ln.unmodelled { background: var(--unmodelled); border-left-color: var(--unmodelled-edge); }
.ln.unmodelled.filledonly { border-left-color: var(--filled-edge); }
.ln.said .no { background: var(--said); color: var(--fg); }
.fold { display: block; width: 100%; text-align: left; border: 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 0.78rem; padding: 2px 10px; cursor: pointer; }
aside h3 { font-size: 1rem; margin: 2px 0 8px 0; }
aside pre { white-space: pre-wrap; font-size: 0.78rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
aside .ex { font-family: ui-monospace, monospace; font-size: 0.8rem; margin: 2px 0 2px 10px; }
aside p { margin: 6px 0; }
aside .close { float: right; }
</style>

const GRID = "holders grid", READER = "signature reader", FILLED = "a part filled from clang's list";
const ALL = [GRID, READER, FILLED];
let view = "own";

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c);
  return node;
}
function n(x) { return Number(x).toLocaleString("en-US"); }
function label(part) { return DATA.sub_models[part] ? DATA.sub_models[part].label : part; }

function lineState(row, block) {
  const shown = view === "own" ? block.own : ALL;
  const reach = row.reach || {};
  const grid = shown.includes(GRID) && reach[GRID];
  const reader = shown.includes(READER) && (reach[READER] || (row.read && row.read.length));
  if (shown.includes(READER) && row.unread && row.unread.length) return "unmodelled";
  if (!reach[GRID] && !reach[READER] && reach[FILLED] && shown.includes(FILLED)) return "unmodelled filledonly";
  if (grid && reader) return "both";
  if (grid) return "grid";
  if (reader) return "reader";
  return "";
}

function legend() {
  const box = document.getElementById("legend");
  const items = [[GRID, "grid"], [READER, "reader"], [FILLED, "filled"]];
  for (const [part, cls] of items) {
    box.append(el("button", {type: "button", class: "chip", onclick: () => showSubModel(part)},
      el("span", {class: "swatch", style: `background: var(--${cls}); border-left-color: var(--${cls}-edge)`}), label(part)));
  }
  box.append(el("button", {type: "button", class: "chip", onclick: showUnmodelled},
    el("span", {class: "swatch", style: "background: var(--unmodelled); border-left-color: var(--unmodelled-edge)"}), "unmodelled"));
  box.append(el("button", {type: "button", class: "chip", onclick: showSaid},
    el("span", {class: "swatch", style: "background: var(--said); border-left-color: var(--said)"}), "clang refused here"));
}

function render() {
  const main = document.getElementById("blocks");
  main.textContent = "";
  DATA.blocks.forEach((block, index) => {
    const section = el("section", {class: "block"});
    section.append(el("h2", {}, `Block ${index} · ${block.title}`));
    const problems = el("ul", {class: "problems"});
    for (const p of block.problems) problems.append(el("li", {}, p));
    section.append(problems);
    const ops = el("div", {class: "row"});
    for (const op of block.operators) ops.append(operatorChip(op, block));
    section.append(ops);
    for (const fn of block.functions) section.append(functionView(fn, block));
    main.append(section);
  });
  document.documentElement.style.setProperty("--header-height", document.querySelector("header").offsetHeight + "px");
}

function operatorChip(op, block) {
  let accepted = 0, programs = 0;
  if (op.texts.length) {
    let taken = 0;
    for (const t of op.texts) if (t.accepted) taken++;
    return el("button", {type: "button", class: "chip op", onclick: () => showOperator(op, block)},
      `${op.name}: ${op.filled}`, el("span", {class: "n"}, ` · ${taken} of ${op.texts.length} texts accepted · not the model`));
  }
  for (const c of Object.values(op.parts)) { accepted += c.accepted; programs += c.programs; }
  let fate = "";
  if (op.kept === true) fate = " · kept";
  else if (op.kept === false) fate = " · dropped";
  return el("button", {type: "button", class: "chip op", onclick: () => showOperator(op, block)},
    `${op.name} ${op.text}`, el("span", {class: "n"}, ` ${n(accepted)} of ${n(programs)}${fate}`));
}

function functionView(fn, block) {
  const details = el("details", {class: "fn", open: ""});
  details.append(el("summary", {}, `${fn.name}  ·  ${fn.file}:${fn.first}`));
  const code = el("div", {class: "code"});
  const states = fn.rows.map(r => lineState(r, block) + (r.words ? " said" : ""));
  let i = 0;
  while (i < fn.rows.length) {
    let j = i;
    while (j + 1 < fn.rows.length && states[j + 1] === states[i]) j++;
    const run = j - i + 1;
    if (run >= 12 && states[i] === "") {
      for (let k = i; k < i + 2; k++) code.append(lineView(fn, fn.rows[k], states[k]));
      const hidden = [];
      for (let k = i + 2; k <= j - 2; k++) hidden.push(lineView(fn, fn.rows[k], states[k]));
      const fold = el("button", {type: "button", class: "fold"}, `⋯ ${hidden.length} lines no sub-model reaches`);
      fold.addEventListener("click", () => fold.replaceWith(...hidden));
      code.append(fold);
      for (let k = j - 1; k <= j; k++) code.append(lineView(fn, fn.rows[k], states[k]));
    } else {
      for (let k = i; k <= j; k++) code.append(lineView(fn, fn.rows[k], states[k]));
    }
    i = j + 1;
  }
  details.append(code);
  return details;
}

function lineView(fn, row, state) {
  const line = el("div", {class: `ln ${state}`}, el("span", {class: "no"}, String(row.n)), el("span", {class: "tx"}, row.text || " "));
  line.addEventListener("click", () => {
    document.querySelectorAll(".ln.sel").forEach(x => x.classList.remove("sel"));
    line.classList.add("sel");
    showLine(fn, row);
  });
  return line;
}

function panel(...children) {
  const body = document.getElementById("panel-body");
  body.textContent = "";
  for (const c of children) if (c) body.append(c);
  document.getElementById("panel").classList.add("open");
}

function example(x) {
  const holders = x.holders && x.holders.length ? ` with ${x.holders.join(", ")}` : "";
  const answer = x.answer === "accepted" ? "accepted" : `refused: ${x.words || x.answer}`;
  return el("div", {class: "ex"}, `${x.text}${holders} → ${answer}`);
}

function lastReadBefore(fn, row) {
  let last = null;
  for (const r of fn.rows) {
    if (r.n >= row.n) break;
    if (r.read && r.read.length) last = r.n;
  }
  return last;
}

function showLine(fn, row) {
  const parts = [el("h3", {}, `${fn.file}:${row.n}`), el("pre", {}, row.text.trim() || " ")];
  const reach = row.reach || {};
  if (row.unread && row.unread.length) {
    const last = lastReadBefore(fn, row);
    parts.push(el("p", {}, el("b", {}, "Unmodelled. "), "complex_signature_reader left this condition unread:"));
    for (const u of row.unread) parts.push(el("div", {class: "ex"}, `${u.code}  (${u.builtin})`));
    if (last !== null) parts.push(el("p", {}, `How far it got: it read every condition down to line ${last}.`));
  }
  if (!reach[GRID] && !reach[READER] && reach[FILLED]) {
    parts.push(el("p", {}, el("b", {}, "Unmodelled. "), "No program of the model reaches this line; only the texts with a part filled from clang's own list do."));
  }
  for (const part of ALL) {
    if (!reach[part]) continue;
    parts.push(el("p", {}, el("b", {}, label(part)), ` · clang ran this line ${n(reach[part])} times for its programs`));
    for (const x of (row.examples || {})[part] || []) parts.push(example(x));
  }
  if (row.read && row.read.length) {
    parts.push(el("p", {}, el("b", {}, "complex_signature_reader"), " read this condition on its accepting paths:"));
    for (const r of row.read.slice(0, 4)) parts.push(el("div", {class: "ex"}, `${r.code}  →  ${r.reading}  (${r.builtin})`));
  }
  for (const w of row.words || []) parts.push(el("p", {}, el("b", {}, `${n(w.count)} programs`), ` of ${w.text}, written for ${w.name} (${label(w.part)}), refused here: “${w.words}”`));
  if (row.branches) parts.push(el("p", {class: "muted"}, `Each side of this condition, over every program: ${row.branches.map(n).join(" / ")}`));
  if (row.everyone) parts.push(el("p", {class: "muted"}, "Every operator of this block ran this line."));
  if (!Object.keys(reach).length && !(row.read && row.read.length) && !(row.unread && row.unread.length)) parts.push(el("p", {class: "muted"}, "No program ran this line, and no sub-model read it."));
  panel(...parts);
}

function showOperator(op, block) {
  const parts = [el("h3", {}, `${op.name} ${op.texts.length ? "" : op.text}`)];
  if (op.texts.length) {
    parts.push(el("p", {}, `Not the model: ${op.written_for}, with ${op.filled} filled from clang's own list (${op.filled_from}). Each text, and how many of its programs clang accepted:`));
    for (const t of op.texts) parts.push(el("div", {class: "ex"}, `${t.text}  ·  ${n(t.accepted)} of ${n(t.programs)}`));
    panel(...parts);
    return;
  }
  for (const [part, c] of Object.entries(op.parts)) parts.push(el("p", {}, el("b", {}, label(part)), ` · ${n(c.programs)} programs, ${n(c.accepted)} accepted by clang`));
  if (op.kept !== undefined) parts.push(el("p", {}, `Our check, on one accepted choice of holders: clang built ${op.built}, so the operator is ${op.kept ? "kept" : "dropped"}.`));
  const elsewhere = block.elsewhere.filter(w => w.text === op.text);
  if (elsewhere.length) {
    parts.push(el("p", {class: "muted"}, "Refused in code this block doesn't show:"));
    for (const w of elsewhere) parts.push(el("div", {class: "ex"}, `${n(w.count)} · ${w.words}`));
  }
  panel(...parts);
}

function showSubModel(part) {
  const s = DATA.sub_models[part];
  const parts = [el("h3", {}, s.label), el("p", {}, s.says)];
  for (const c of s.code) { parts.push(el("p", {class: "muted"}, `${c.file}:${c.line}`)); parts.push(el("pre", {}, c.text)); }
  panel(...parts);
}

function showUnmodelled() {
  panel(el("h3", {}, "unmodelled"), el("p", {}, "A line no sub-model reaches where the model stopped: a condition complex_signature_reader left unread, or a line only the texts with a part filled from clang's own list reach."));
}

function showSaid() {
  panel(el("h3", {}, "clang refused here"), el("p", {}, "A yellow line number is where clang wrote the words of a refusal our programs got: the words matched to clang's list of diagnostics, and the diagnostic's name to this line."));
}

document.getElementById("view-own").addEventListener("click", () => { view = "own"; setView(); });
document.getElementById("view-all").addEventListener("click", () => { view = "all"; setView(); });
function setView() {
  document.getElementById("view-own").setAttribute("aria-pressed", String(view === "own"));
  document.getElementById("view-all").setAttribute("aria-pressed", String(view === "all"));
  render();
}
document.getElementById("q-page").addEventListener("click", () => document.getElementById("pop-page").classList.toggle("open"));
document.getElementById("panel-close").addEventListener("click", () => document.getElementById("panel").classList.remove("open"));
document.getElementById("totals").textContent = `${n(DATA.asked)} programs asked again; ${n(DATA.same)} answered the same by Ubuntu's clang and ours` + (DATA.small ? " · small run" : "");
document.getElementById("pop-page").textContent = `Each block is clang's own code (${DATA.lowerer}) for a handful of GNU C's operators, simplest first. A line is marked by the sub-model whose programs made clang run it (counted by a clang built to count its own lines, run ${DATA.run}), or whose reading holds its condition. "each block's own sub-models" marks only the sub-models a block is about; "every sub-model's reach" marks them all.`;
legend();
render();
</script>
</body>
</html>
