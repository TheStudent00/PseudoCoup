<script>
const DATA = {"source": ["\"\"\"What GNU C's __sync_fetch_and_add_4(p, v) does, in Python.", "", "memory is a row of bytes; each byte holds a whole number from 0 to 255.", "p is a position in it. size is how many bytes, from p on, hold one number:", "the _4 in __sync_fetch_and_add_4 is size 4.        # 4 bytes, all 0", "", "", "def read_number(p, size):", "    # the number held in memory[p : p + size], the size bytes from p on.", "    # The byte at p counts as it is, the next one times 256, the next one", "    # times 256 * 256, and the next one times 256 * 256 * 256.", "    number = 0", "    for i in range(size):", "        number = number + memory[p + i] * (256 ** i)", "    return number", "", "", "def write_number(p, size, number):", "    # the number, put into memory[p : p + size], in the same order read_number reads it", "    for i in range(size):", "        memory[p + i] = (number // (256 ** i)) % 256", "", "", "def fetch_and_add(p, size, v):", "    old = read_number(p, size)      # the number at p, size bytes long", "    total = old + v                 # the add", "    kept = total % (256 ** size)    # what fits back into size bytes", "    write_number(p, size, kept)     # the sum, written back at p", "    return old                      # given back: the number as it was", "", "", "# Threads A and B run at the same time, each on its own processor core. They", "# share two files to work on, and next_file: the 4 bytes memory[0 : 4], the", "# number of the next file nobody has taken. Python runs one line at a time,", "# so the two threads' steps are written below in the order the cores did them.", "files = [\"a.txt\", \"b.txt\"]", "", "# 1. Without fetch_and_add: each thread takes a file by reading next_file,", "# then writing next_file + 1.", "write_number(0, 4, 0)                   # next_file = 0", "a = read_number(0, 4)                   # A reads 0", "b = read_number(0, 4)                   # B reads 0: A has not written yet", "write_number(0, 4, a + 1)               # A writes 1", "write_number(0, 4, b + 1)               # B writes 1", "next_file = read_number(0, 4)", "print(f\"read, then write: A takes {files[a]}, B takes {files[b]}, next_file is {next_file}\")", "", "# 2. With fetch_and_add: each thread's read and write are one step, so B's", "# step comes after A's, never between A's read and A's write.", "write_number(0, 4, 0)                   # next_file = 0", "a = fetch_and_add(0, 4, 1)              # A gets 0, and next_file becomes 1", "b = fetch_and_add(0, 4, 1)              # B gets 1, and next_file becomes 2", "next_file = read_number(0, 4)", "print(f\"fetch_and_add:    A takes {files[a]}, B takes {files[b]}, next_file is {next_file}\")"], "steps": [{"line": null, "fn": null, "thread": null, "note": "start: memory is 4 bytes, all 0", "state": {"memory": [0, 0, 0, 0], "values": [], "printed": ""}, "helpers": []}, {"line": 43, "fn": null, "thread": null, "note": null, "state": {"memory": [0, 0, 0, 0], "values": [], "printed": ""}, "helpers": [{"at": 0, "kind": "write_number", "p": 0, "size": 4, "number": 0, "result": null}]}, {"line": 44, "fn": null, "thread": "A", "note": null, "state": {"memory": [0, 0, 0, 0], "values": [["a", 0]], "printed": ""}, "helpers": [{"at": 1, "kind": "read_number", "p": 0, "size": 4, "result": 0}]}, {"line": 45, "fn": null, "thread": "B", "note": null, "state": {"memory": [0, 0, 0, 0], "values": [["a", 0], ["b", 0]], "printed": ""}, "helpers": [{"at": 2, "kind": "read_number", "p": 0, "size": 4, "result": 0}]}, {"line": 46, "fn": null, "thread": "A", "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["a", 0], ["b", 0]], "printed": ""}, "helpers": [{"at": 3, "kind": "write_number", "p": 0, "size": 4, "number": 1, "result": null}]}, {"line": 47, "fn": null, "thread": "B", "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["a", 0], ["b", 0]], "printed": ""}, "helpers": [{"at": 4, "kind": "write_number", "p": 0, "size": 4, "number": 1, "result": null}]}, {"line": 48, "fn": null, "thread": null, "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["a", 0], ["b", 0], ["next_file", 1]], "printed": ""}, "helpers": [{"at": 5, "kind": "read_number", "p": 0, "size": 4, "result": 1}]}, {"line": 49, "fn": null, "thread": null, "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["a", 0], ["b", 0], ["next_file", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 53, "fn": null, "thread": null, "note": null, "state": {"memory": [0, 0, 0, 0], "values": [], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": [{"at": 7, "kind": "write_number", "p": 0, "size": 4, "number": 0, "result": null}]}, {"line": 54, "fn": "fetch_and_add", "thread": "A", "note": "calls fetch_and_add(p = 0, size = 4, v = 1)", "state": {"memory": [0, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 28, "fn": "fetch_and_add", "thread": "A", "note": null, "state": {"memory": [0, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 0]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": [{"at": 10, "kind": "read_number", "p": 0, "size": 4, "result": 0}]}, {"line": 29, "fn": "fetch_and_add", "thread": "A", "note": null, "state": {"memory": [0, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 0], ["total", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 30, "fn": "fetch_and_add", "thread": "A", "note": null, "state": {"memory": [0, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 0], ["total", 1], ["kept", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 31, "fn": "fetch_and_add", "thread": "A", "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 0], ["total", 1], ["kept", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": [{"at": 13, "kind": "write_number", "p": 0, "size": 4, "number": 1, "result": null}]}, {"line": 32, "fn": "fetch_and_add", "thread": "A", "note": "fetch_and_add gives back 0", "state": {"memory": [1, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 0], ["total", 1], ["kept", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 54, "fn": null, "thread": "A", "note": "back: a = 0", "state": {"memory": [1, 0, 0, 0], "values": [["a", 0]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 55, "fn": "fetch_and_add", "thread": "B", "note": "calls fetch_and_add(p = 0, size = 4, v = 1)", "state": {"memory": [1, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 28, "fn": "fetch_and_add", "thread": "B", "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": [{"at": 18, "kind": "read_number", "p": 0, "size": 4, "result": 1}]}, {"line": 29, "fn": "fetch_and_add", "thread": "B", "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 1], ["total", 2]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 30, "fn": "fetch_and_add", "thread": "B", "note": null, "state": {"memory": [1, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 1], ["total", 2], ["kept", 2]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 31, "fn": "fetch_and_add", "thread": "B", "note": null, "state": {"memory": [2, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 1], ["total", 2], ["kept", 2]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": [{"at": 21, "kind": "write_number", "p": 0, "size": 4, "number": 2, "result": null}]}, {"line": 32, "fn": "fetch_and_add", "thread": "B", "note": "fetch_and_add gives back 1", "state": {"memory": [2, 0, 0, 0], "values": [["p", 0], ["size", 4], ["v", 1], ["old", 1], ["total", 2], ["kept", 2]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 55, "fn": null, "thread": "B", "note": "back: b = 1", "state": {"memory": [2, 0, 0, 0], "values": [["a", 0], ["b", 1]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": []}, {"line": 56, "fn": null, "thread": null, "note": null, "state": {"memory": [2, 0, 0, 0], "values": [["a", 0], ["b", 1], ["next_file", 2]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\n"}, "helpers": [{"at": 24, "kind": "read_number", "p": 0, "size": 4, "result": 2}]}, {"line": 57, "fn": null, "thread": null, "note": null, "state": {"memory": [2, 0, 0, 0], "values": [["a", 0], ["b", 1], ["next_file", 2]], "printed": "read, then write: A takes a.txt, B takes a.txt, next_file is 1\nfetch_and_add:    A takes a.txt, B takes b.txt, next_file is 2\n"}, "helpers": []}]};
const steps = DATA.steps;
let at = 0;

function esc(text) {
	return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function drawCode() {
	const pre = document.getElementById("code");
	let html = "";
	for (let i = 0; i < DATA.source.length; i++) {
		const text = DATA.source[i];
		const cut = text.indexOf("#");
		let body = esc(text);
		if (cut >= 0) {
			body = esc(text.slice(0, cut)) + '<span class="comment">' + esc(text.slice(cut)) + "</span>";
		}
		html += '<span class="ln" id="ln' + (i + 1) + '"><span class="no">' + (i + 1) + "</span>" + body + "</span>";
	}
	pre.innerHTML = html;
}

function sameContext(a, b) {
	return a && b && a.fn === b.fn && a.thread === b.thread;
}

function noteOf(step) {
	let note = step.note;
	if (note || !step.line) return note || "";
	note = DATA.source[step.line - 1].split("#")[0].trim();
	const name = note.split("=")[0].trim();
	if (note.indexOf(" = ") > 0 && /^[a-z_]+$/.test(name)) {
		for (const pair of step.state.values) {
			if (pair[0] === name) note += "  →  " + name + " = " + pair[1];
		}
	}
	if (note.startsWith("print(")) note += "  →  prints one line";
	return note;
}

function show(k) {
	at = Math.max(0, Math.min(steps.length - 1, k));
	const step = steps[at];
	const before = at > 0 ? steps[at - 1] : null;
	document.getElementById("count").textContent = "step " + at + " of " + (steps.length - 1);
	document.getElementById("back").disabled = at === 0;
	document.getElementById("next").disabled = at === steps.length - 1;
	document.getElementById("thread").innerHTML = step.thread ? '<span class="thread ' + step.thread + '">thread ' + step.thread + "</span>" : "";

	document.querySelectorAll(".ln.now").forEach(function (el) { el.classList.remove("now"); });
	if (step.line) {
		const el = document.getElementById("ln" + step.line);
		el.classList.add("now");
		const box = document.getElementById("codebox");
		box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 3);
	}
	document.getElementById("note").textContent = noteOf(step);

	const read = new Set();
	const written = new Set();
	let helperHtml = "";
	for (const h of step.helpers) {
		const slice = step.state.memory.slice(h.p, h.p + h.size);
		for (let i = h.p; i < h.p + h.size; i++) {
			if (h.kind === "read_number") read.add(i); else written.add(i);
		}
		if (h.kind === "read_number") {
			helperHtml += "<div>read_number(" + h.p + ", " + h.size + "): memory[" + h.p + " : " + (h.p + h.size) + "] is [" + slice.join(", ") + "], so " + h.result + "</div>";
		} else {
			helperHtml += "<div>write_number(" + h.p + ", " + h.size + ", " + h.number + "): memory[" + h.p + " : " + (h.p + h.size) + "] is now [" + slice.join(", ") + "]</div>";
		}
	}
	let memHtml = "";
	for (let i = 0; i < step.state.memory.length; i++) {
		let cls = "byte";
		if (read.has(i)) cls += " read";
		if (written.has(i)) cls += " written";
		memHtml += '<div class="' + cls + '"><div class="value">' + step.state.memory[i] + '</div><div class="name">memory[' + i + "]</div></div>";
	}
	document.getElementById("memory").innerHTML = memHtml;
	document.getElementById("helpers").innerHTML = helperHtml;

	const old = {};
	if (before && sameContext(before, step)) {
		for (const pair of before.state.values) old[pair[0]] = pair[1];
	}
	let varHtml = step.fn ? '<span class="where">in ' + step.fn + ":</span>" : "";
	let count = 0;
	for (const pair of step.state.values) {
		const changed = at > 0 && (!(pair[0] in old) || old[pair[0]] !== pair[1]);
		varHtml += '<span class="' + (changed ? "changed" : "") + '">' + esc(pair[0]) + " = " + pair[1] + "</span>";
		count += 1;
	}
	if (count === 0) varHtml += '<span class="none">none yet</span>';
	document.getElementById("vars").innerHTML = varHtml;
	document.getElementById("out").textContent = step.state.printed;
}

drawCode();
document.getElementById("back").addEventListener("click", function () { show(at - 1); });
document.getElementById("next").addEventListener("click", function () { show(at + 1); });
document.addEventListener("keydown", function (e) {
	if (e.key === "ArrowRight") { show(at + 1); e.preventDefault(); }
	if (e.key === "ArrowLeft") { show(at - 1); e.preventDefault(); }
});
show(0);
</script>
</body>
