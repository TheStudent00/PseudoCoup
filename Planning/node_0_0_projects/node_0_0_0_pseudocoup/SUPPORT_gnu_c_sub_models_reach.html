omicExpr::AO__hip_atomic_fetch_min:"},{"n":4057,"text":"    ArithAllows = AOEVT_FP;"},{"n":4058,"text":"    Form = Arithmetic;"},{"n":4059,"text":"    break;"},{"n":4060,"text":"  case AtomicExpr::AO__c11_atomic_fetch_and:"},{"n":4061,"text":"  case AtomicExpr::AO__c11_atomic_fetch_or:"},{"n":4062,"text":"  case AtomicExpr::AO__c11_atomic_fetch_xor:"},{"n":4063,"text":"  case AtomicExpr::AO__hip_atomic_fetch_and:"},{"n":4064,"text":"  case AtomicExpr::AO__hip_atomic_fetch_or:"},{"n":4065,"text":"  case AtomicExpr::AO__hip_atomic_fetch_xor:"},{"n":4066,"text":"  case AtomicExpr::AO__c11_atomic_fetch_nand:"},{"n":4067,"text":"  case AtomicExpr::AO__opencl_atomic_fetch_and:"},{"n":4068,"text":"  case AtomicExpr::AO__opencl_atomic_fetch_or:"},{"n":4069,"text":"  case AtomicExpr::AO__opencl_atomic_fetch_xor:"},{"n":4070,"text":"  case AtomicExpr::AO__atomic_fetch_and:"},{"n":4071,"text":"  case AtomicExpr::AO__atomic_fetch_or:"},{"n":4072,"text":"  case AtomicExpr::AO__atomic_fetch_xor:"},{"n":4073,"text":"  case AtomicExpr::AO__atomic_fetch_nand:"},{"n":4074,"text":"  case AtomicExpr::AO__atomic_and_fetch:"},{"n":4075,"text":"  case AtomicExpr::AO__atomic_or_fetch:"},{"n":4076,"text":"  case AtomicExpr::AO__atomic_xor_fetch:"},{"n":4077,"text":"  case AtomicExpr::AO__atomic_nand_fetch:"},{"n":4078,"text":"  case AtomicExpr::AO__scoped_atomic_fetch_and:"},{"n":4079,"text":"  case AtomicExpr::AO__scoped_atomic_fetch_or:"},{"n":4080,"text":"  case AtomicExpr::AO__scoped_atomic_fetch_xor:"},{"n":4081,"text":"  case AtomicExpr::AO__scoped_atomic_fetch_nand:"},{"n":4082,"text":"  case AtomicExpr::AO__scoped_atomic_and_fetch:"},{"n":4083,"text":"  case AtomicExpr::AO__scoped_atomic_or_fetch:"},{"n":4084,"text":"  case AtomicExpr::AO__scoped_atomic_xor_fetch:"},{"n":4085,"text":"  case AtomicExpr::AO__scoped_atomic_nand_fetch:"},{"n":4086,"text":"    Form = Arithmetic;"},{"n":4087,"text":"    break;"},{"n":4088,"text":""},{"n":4089,"text":"  case AtomicExpr::AO__c11_atomic_exchange:"},{"n":4090,"text":"  case AtomicExpr::AO__hip_atomic_exchange:"},{"n":4091,"text":"  case AtomicExpr::AO__opencl_atomic_exchange:"},{"n":4092,"text":"  case AtomicExpr::AO__atomic_exchange_n:"},{"n":4093,"text":"  case AtomicExpr::AO__scoped_atomic_exchange_n:"},{"n":4094,"text":"    Form = Xchg;"},{"n":4095,"text":"    break;"},{"n":4096,"text":""},{"n":4097,"text":"  case AtomicExpr::AO__atomic_exchange:"},{"n":4098,"text":"  case AtomicExpr::AO__scoped_atomic_exchange:"},{"n":4099,"text":"    Form = GNUXchg;"},{"n":4100,"text":"    break;"},{"n":4101,"text":""},{"n":4102,"text":"  case AtomicExpr::AO__c11_atomic_compare_exchange_strong:"},{"n":4103,"text":"  case AtomicExpr::AO__c11_atomic_compare_exchange_weak:"},{"n":4104,"text":"  case AtomicExpr::AO__hip_atomic_compare_exchange_strong:"},{"n":4105,"text":"  case AtomicExpr::AO__opencl_atomic_compare_exchange_strong:"},{"n":4106,"text":"  case AtomicExpr::AO__opencl_atomic_compare_exchange_weak:"},{"n":4107,"text":"  case AtomicExpr::AO__hip_atomic_compare_exchange_weak:"},{"n":4108,"text":"    Form = C11CmpXchg;"},{"n":4109,"text":"    break;"},{"n":4110,"text":""},{"n":4111,"text":"  case AtomicExpr::AO__atomic_compare_exchange:"},{"n":4112,"text":"  case AtomicExpr::AO__atomic_compare_exchange_n:"},{"n":4113,"text":"  case AtomicExpr::AO__scoped_atomic_compare_exchange:"},{"n":4114,"text":"  case AtomicExpr::AO__scoped_atomic_compare_exchange_n:"},{"n":4115,"text":"    Form = GNUCmpXchg;"},{"n":4116,"text":"    break;"},{"n":4117,"text":""},{"n":4118,"text":"  case AtomicExpr::AO__atomic_test_and_set:"},{"n":4119,"text":"    Form = TestAndSetByte;"},{"n":4120,"text":"    break;"},{"n":4121,"text":""},{"n":4122,"text":"  case AtomicExpr::AO__atomic_clear:"},{"n":4123,"text":"    Form = ClearByte;"},{"n":4124,"text":"    break;"},{"n":4125,"text":"  }"},{"n":4126,"text":""},{"n":4127,"text":"  unsigned AdjustedNumArgs = NumArgs[Form];"},{"n":4128,"text":"  if ((IsOpenCL || IsHIP || IsScoped) &&"},{"n":4129,"text":"      Op != AtomicExpr::AO__opencl_atomic_init)"},{"n":4130,"text":"    ++AdjustedNumArgs;"},{"n":4131,"text":"  // Check we have the right number of arguments."},{"n":4132,"text":"  if (Args.size() < AdjustedNumArgs) {"},{"n":4133,"text":"    Diag(CallRange.getEnd(), diag::err_typecheck_call_too_few_args)"},{"n":4134,"text":"        << 0 << AdjustedNumArgs << static_cast<unsigned>(Args.size())"},{"n":4135,"text":"        << /*is non object*/ 0 << ExprRange;"},{"n":4136,"text":"    return ExprError();"},{"n":4137,"text":"  } else if (Args.size() > AdjustedNumArgs) {"},{"n":4138,"text":"    Diag(Args[AdjustedNumArgs]->getBeginLoc(),"},{"n":4139,"text":"         diag::err_typecheck_call_too_many_args)"},{"n":4140,"text":"        << 0 << AdjustedNumArgs << static_cast<unsigned>(Args.size())"},{"n":4141,"text":"        << /*is non object*/ 0 << ExprRange;"},{"n":4142,"text":"    return ExprError();"},{"n":4143,"text":"  }"},{"n":4144,"text":""},{"n":4145,"text":"  // Inspect the first argument of the atomic operation."},{"n":4146,"text":"  Expr *Ptr = Args[0];"},{"n":4147,"text":"  ExprResult ConvertedPtr = DefaultFunctionArrayLvalueConversion(Ptr);"},{"n":4148,"text":"  if (ConvertedPtr.isInvalid())"},{"n":4149,"text":"    return ExprError();"},{"n":4150,"text":""},{"n":4151,"text":"  Ptr = ConvertedPtr.get();"},{"n":4152,"text":"  const PointerType *pointerType = Ptr->getType()->getAs<PointerType>();"},{"n":4153,"text":"  if (!pointerType) {"},{"n":4154,"text":"    Diag(ExprRange.getBegin(), diag::err_atomic_builtin_must_be_pointer)"},{"n":4155,"text":"        << Ptr->getType() << 0 << Ptr->getSourceRange();"},{"n":4156,"text":"    return ExprError();"},{"n":4157,"text":"  }"},{"n":4158,"text":""},{"n":4159,"text":"  // For a __c11 builtin, this should be a pointer to an _Atomic type."},{"n":4160,"text":"  QualType AtomTy = pointerType->getPointeeType(); // 'A'"},{"n":4161,"text":"  QualType ValType = AtomTy; // 'C'"},{"n":4162,"text":"  if (IsC11) {"},{"n":4163,"text":"    if (!AtomTy->isAtomicType()) {"},{"n":4164,"text":"      Diag(ExprRange.getBegin(), diag::err_atomic_op_needs_atomic)"},{"n":4165,"text":"          << Ptr->getType() << Ptr->getSourceRange();"},{"n":4166,"text":"      return ExprError();"},{"n":4167,"text":"    }"},{"n":4168,"text":"    if ((Form != Load && Form != LoadCopy && AtomTy.isConstQualified()) ||"},{"n":4169,"text":"        AtomTy.getAddressSpace() == LangAS::opencl_constant) {"},{"n":4170,"text":"      Diag(ExprRange.getBegin(), diag::err_atomic_op_needs_non_const_atomic)"},{"n":4171,"text":"          << (AtomTy.isConstQualified() ? 0 : 1) << Ptr->getType()"},{"n":4172,"text":"          << Ptr->getSourceRange();"},{"n":4173,"text":"      return ExprError();"},{"n":4174,"text":"    }"},{"n":4175,"text":"    ValType = AtomTy->castAs<AtomicType>()->getValueType();"},{"n":4176,"text":"  } else if (Form != Load && Form != LoadCopy) {"},{"n":4177,"text":"    if (ValType.isConstQualified()) {"},{"n":4178,"text":"      Diag(ExprRange.getBegin(), diag::err_atomic_op_needs_non_const_pointer)"},{"n":4179,"text":"          << Ptr->getType() << Ptr->getSourceRange();"},{"n":4180,"text":"      return ExprError();"},{"n":4181,"text":"    }"},{"n":4182,"text":"  }"},{"n":4183,"text":""},{"n":4184,"text":"  if (Form != TestAndSetByte && Form != ClearByte) {"},{"n":4185,"text":"    // Pointer to object of size zero is not allowed."},{"n":4186,"text":"    if (RequireCompleteType(Ptr->getBeginLoc(), AtomTy,"},{"n":4187,"text":"                            diag::err_incomplete_type))"},{"n":4188,"text":"      return ExprError();"},{"n":4189,"text":""},{"n":4190,"text":"    if (Context.getTypeInfoInChars(AtomTy).Width.isZero()) {"},{"n":4191,"text":"      Diag(ExprRange.getBegin(), diag::err_atomic_builtin_must_be_pointer)"},{"n":4192,"text":"          << Ptr->getType() << 1 << Ptr->getSourceRange();"},{"n":4193,"text":"      return ExprError();"},{"n":4194,"text":"    }"},{"n":4195,"text":"  } else {"},{"n":4196,"text":"    // The __atomic_clear and __atomic_test_and_set intrinsics accept any"},{"n":4197,"text":"    // non-const pointer type, including void* and pointers to incomplete"},{"n":4198,"text":"    // structs, but only access the first byte."},{"n":4199,"text":"    AtomTy = Context.CharTy;"},{"n":4200,"text":"    AtomTy = AtomTy.withCVRQualifiers("},{"n":4201,"text":"        pointerType->getPointeeType().getCVRQualifiers());"},{"n":4202,"text":"    QualType PointerQT = Context.getPointerType(AtomTy);"},{"n":4203,"text":"    pointerType = PointerQT->getAs<PointerType>();"},{"n":4204,"text":"    Ptr = ImpCastExprToType(Ptr, PointerQT, CK_BitCast).get();"},{"n":4205,"text":"    ValType = AtomTy;"},{"n":4206,"text":"  }"},{"n":4207,"text":""},{"n":4208,"text":"  PointerAuthQualifier PointerAuth = AtomTy.getPointerAuth();"},{"n":4209,"text":"  if (PointerAuth && PointerAuth.isAddressDiscriminated()) {"},{"n":4210,"text":"    Diag(ExprRange.getBegin(),"},{"n":4211,"text":"         diag::err_atomic_op_needs_non_address_discriminated_pointer)"},{"n":4212,"text":"        << 0 << Ptr->getType() << Ptr->getSourceRange();"},{"n":4213,"text":"    return ExprError();"},{"n":4214,"text":"  }"},{"n":4215,"text":""},{"n":4216,"text":"  // For an arithmetic operation, the implied arithmetic must be well-formed."},{"n":4217,"text":"  if (Form == Arithmetic) {"},{"n":4218,"text":"    // GCC does not enforce these rules for GNU atomics, but we do to help catch"},{"n":4219,"text":"    // trivial type errors."},{"n":4220,"text":"    auto IsAllowedValueType = [&](QualType ValType,"},{"n":4221,"text":"                                  unsigned AllowedType) -> bool {"},{"n":4222,"text":"      if (ValType->isIntegerType())"},{"n":4223,"text":"        return true;"},{"n":4224,"text":"      if (ValType->isPointerType())"},{"n":4225,"text":"        return AllowedType & AOEVT_Pointer;"},{"n":4226,"text":"      if (!(ValType->isFloatingType() && (AllowedType & AOEVT_FP)))"},{"n":4227,"text":"        return false;"},{"n":4228,"text":"      // LLVM Parser does not allow atomicrmw with x86_fp80 type."},{"n":4229,"text":"      if (ValType->isSpecificBuiltinType(BuiltinType::LongDouble) &&"},{"n":4230,"text":"          &Context.getTargetInfo().getLongDoubleFormat() =="},{"n":4231,"text":"              &llvm::APFloat::x87DoubleExtended())"},{"n":4232,"text":"        return false;"},{"n":4233,"text":"      return true;"},{"n":4234,"text":"    };"},{"n":4235,"text":"    if (!IsAllowedValueType(ValType, ArithAllows)) {"},{"n":4236,"text":"      auto DID = ArithAllows & AOEVT_FP"},{"n":4237,"text":"                     ? (ArithAllows & AOEVT_Pointer"},{"n":4238,"text":"                            ? diag::err_atomic_op_needs_atomic_int_ptr_or_fp"},{"n":4239,"text":"                            : diag::err_atomic_op_needs_atomic_int_or_fp)"},{"n":4240,"text":"                     : diag::err_atomic_op_needs_atomic_int;"},{"n":4241,"text":"      Diag(ExprRange.getBegin(), DID)"},{"n":4242,"text":"          << IsC11 << Ptr->getType() << Ptr->getSourceRange();"},{"n":4243,"text":"      return ExprError();"},{"n":4244,"text":"    }"},{"n":4245,"text":"    if (IsC11 && ValType->isPointerType() &&"},{"n":4246,"text":"        RequireCompleteType(Ptr->getBeginLoc(), ValType->getPointeeType(),"},{"n":4247,"text":"                            diag::err_incomplete_type)) {"},{"n":4248,"text":"      return ExprError();"},{"n":4249,"text":"    }"},{"n":4250,"text":"  } else if (IsN && !ValType->isIntegerType() && !ValType->isPointerType()) {"},{"n":4251,"text":"    // For __atomic_*_n operations, the value type must be a scalar integral or"},{"n":4252,"text":"    // pointer type which is 1, 2, 4, 8 or 16 bytes in length."},{"n":4253,"text":"    Diag(ExprRange.getBegin(), diag::err_atomic_op_needs_atomic_int_or_ptr)"},{"n":4254,"text":"        << IsC11 << Ptr->getType() << Ptr->getSourceRange();"},{"n":4255,"text":"    return ExprError();"},{"n":4256,"text":"  }"},{"n":4257,"te const PART_LABEL = {"holders grid": "the cross-product grid", "signature reader": "complex_signature_reader", "places": "log 479's place functions"};
let view = "python";

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c);
  return node;
}
function n(x) { return Number(x).toLocaleString("en-US"); }
function count(x, word, words) { return `${n(x)} ${x === 1 ? word : words}`; }
function withCode(text) {
  const box = el("span", {});
  text.split("`").forEach((part, i) => box.append(i % 2 ? el("code", {}, part) : part));
  return box;
}
function subModel(id) { return DATA.sub_models.find(s => s.id === id); }
function swatch(id) { return el("span", {class: "swatch", style: `background: var(--${id}); border-left-color: var(--${id}-edge)`}); }
function dashedSwatch(id) { return el("span", {class: "swatch dashed", style: `background: var(--${id}); border-left-color: var(--${id}-edge)`}); }

function panel(...children) {
  const body = document.getElementById("panel-body");
  body.textContent = "";
  for (const c of children) if (c) body.append(c);
  document.getElementById("panel").classList.add("open");
}

function legend() {
  const box = document.getElementById("legend");
  for (const s of DATA.sub_models) box.append(el("button", {type: "button", class: "chip", onclick: () => showSubModel(s)}, swatch(s.id), s.label));
  box.append(el("span", {class: "chip"}, swatch("unreached"), "not reached: closed by our setup"));
  box.append(el("button", {type: "button", class: "chip", onclick: () => document.getElementById("untried").scrollIntoView()}, dashedSwatch("unmodelled"), "unmodelled: a holder or place we don't try"));
  box.append(el("button", {type: "button", class: "chip", onclick: () => document.getElementById("unmodelled").scrollIntoView()}, swatch("unmodelled"), "unmodelled: every place our walker stops"));
}

function exitCount(example, key) {
  const e = example.exits[key];
  return e ? e.programs : 0;
}

function pythonState(example, line) {
  if (line.kind === "unmodelled") return "unmodelled";
  if (line.kind === "unreached" && line.note.startsWith("not tried")) return "untried";
  if (line.kind === "unreached") return "unreached";
  if (line.kind === "exit") return exitCount(example, line.note) ? "reached" : "unreached";
  return "code";
}

function lineStyle(example, state) {
  if (state === "reached") return `background: var(--${example.sub_model}); border-left-color: var(--${example.sub_model}-edge)`;
  return "";
}

function codeLine(example, number, text, state, onclick, badge) {
  const row = el("div", {class: `ln ${state === "reached" || state === "code" ? "" : state} ${state === "dim" ? "dim" : ""}`, style: lineStyle(example, state)},
    el("span", {class: "no"}, number), el("span", {class: "tx"}, text || " "), badge ? el("span", {class: "badge"}, badge) : null);
  row.addEventListener("click", () => { document.querySelectorAll(".ln.sel").forEach(x => x.classList.remove("sel")); row.classList.add("sel"); onclick(); });
  return row;
}

function pythonView(example) {
  const box = el("div", {class: "code"});
  example.python.forEach((line, i) => {
    const state = pythonState(example, line);
    const badge = line.kind === "exit" ? `${n(exitCount(example, line.note))} programs` : null;
    box.append(codeLine(example, String(i + 1), line.text, state, () => showPythonLine(example, line), badge));
  });
  return box;
}

function clangStates(example) {
  const rank = {"code": 1, "unreached": 2, "untried": 3, "unmodelled": 3, "reached": 4};
  const states = {};
  const owners = {};
  for (const line of example.python) {
    const state = pythonState(example, line);
    for (const number of line.lines) {
      if (!states[number] || rank[state] > rank[states[number]]) { states[number] = state; owners[number] = line; }
    }
  }
  return {states, owners};
}

function clangView(example) {
  const box = el("div", {class: "code"});
  const {states, owners} = clangStates(example);
  let run = [];
  const flush = () => {
    if (run.length >= 8) {
      for (const r of run.slice(0, 2)) box.append(r.node);
      const hidden = run.slice(2, run.length - 2).map(r => r.node);
      const fold = el("button", {type: "button", class: "fold"}, `⋯ ${hidden.length} lines`);
      fold.addEventListener("click", () => fold.replaceWith(...hidden));
      box.append(fold);
      for (const r of run.slice(run.length - 2)) box.append(r.node);
    } else for (const r of run) box.append(r.node);
    run = [];
  };
  for (const row of example.clang) {
    const state = states[row.n] || "dim";
    const owner = owners[row.n];
    const node = codeLine(example, String(row.n), row.text, state, () => owner ? showPythonLine(example, owner) : showClangLine(example, row), null);
    if (state === "dim") run.push({node}); else { flush(); box.append(node); }
  }
  flush();
  return box;
}

function exitChips(example) {
  const box = el("div", {class: "exits row"});
  box.append(el("span", {class: "muted"}, "exits"));
  const names = Object.keys(example.exits).sort((a, b) => example.exits[b].programs - example.exits[a].programs);
  for (const name of names) {
    const e = example.exits[name];
    box.append(el("button", {type: "button", class: "chip", onclick: () => showExit(example, name)}, name, el("span", {class: "muted"}, ` ${n(e.programs)}`)));
  }
  if (example.programs) {
    const parts = Object.entries(example.programs).map(([p, c]) => `${PART_LABEL[p] || p}: ${n(c.accepted)} of ${n(c.programs)} accepted`);
    box.append(el("span", {class: "muted"}, parts.join(" · ")));
  }
  return box;
}

function exampleCard(example) {
  const card = el("div", {class: "card"});
  card.append(el("div", {class: "head"}, el("span", {class: "muted"}, "entry "), el("code", {}, example.entry), el("span", {class: "muted"}, `  ·  ${example.function}, ${example.file}:${example.first}`)));
  card.append(exitChips(example));
  if (view === "python") card.append(pythonView(example));
  if (view === "clang") card.append(clangView(example));
  if (view === "paths") card.append(pathsView(example));
  return card;
}

function pathsView(example) {
  const box = el("div", {class: "paths"});
  const en = example.enumeration;
  if (!en) {
    box.append(el("p", {class: "muted"}, `Not enumerated yet: our walker has not been run on ${example.file} for this entry.`));
    return box;
  }
  box.append(el("p", {}, `Every path through clang's checking code for this entry, as complex_signature_reader's walk enumerates it (run elv2_l191). Each test is clang's own, at its line; "yes" or "no" is the side the path takes.`));
  const t = el("table", {class: "stops"});
  t.append(el("tr", {class: "heads"}, el("th", {}, "what the walk follows"), el("th", {class: "narrow"}, "paths"), el("th", {class: "narrow"}, "accepting"), el("th", {class: "narrow"}, "refusing"), el("th", {class: "narrow"}, "undecided")));
  for (const lv of en.levels) t.append(el("tr", {}, el("td", {"data-label": "what the walk follows"}, lv.label, el("span", {class: "muted"}, ` (${lv.how})`)), el("td", {"data-label": "paths"}, n(lv.paths)), el("td", {"data-label": "accepting"}, n(lv.accepting)), el("td", {"data-label": "refusing"}, n(lv.refusing)), el("td", {"data-label": "undecided"}, n(lv.undecided))));
  const classes = Object.entries(en.classes).map(([k, v]) => `${v} ${k}`).join(", ");
  t.append(el("tr", {}, el("td", {"data-label": "what the walk follows"}, "and the type tests followed too (isIntegerType, the sizes on riscv64)", el("span", {class: "muted"}, " (by reading clang's code, not walked)")), el("td", {"data-label": "paths"}, ""), el("td", {"data-label": "accepting"}, classes), el("td", {"data-label": "refusing"}, ""), el("td", {"data-label": "undecided"}, "")));
  box.append(t);
  box.append(el("p", {class: "muted"}, `Line 4856's table row for this builtin, read from SemaChecking.cpp: ${en.table_row.join(", ")}.`));
  box.append(el("h4", {}, `The ${en.accepting.length} accepting paths, with lines 4856 and 4867 followed`));
  for (const p of en.accepting) {
    const tagClass = p.reading.class === "real" ? "real" : (p.reading.class === "impossible" ? "impossible" : "closed");
    const d = el("details", {});
    d.append(el("summary", {}, `#${p.number}  size ${p.size} · ${p.kind}${p.bitint ? " · a _BitInt" : ""}`, el("span", {class: `tag ${tagClass}`}, p.reading.class)));
    d.append(el("p", {class: "muted"}, withCode(p.reading.why)));
    const tests = el("div", {class: "tests"});
    for (const test of p.tests) tests.append(el("div", {}, `line ${test.lines.join(", ") || "?"}: ${test.value} → ${test.side ? "yes" : "no"}`));
    d.append(tests);
    box.append(d);
  }
  box.append(el("h4", {}, `The ${en.refusing_count} refusing paths, by the test that refuses`));
  const r = el("table", {class: "stops"});
  r.append(el("tr", {class: "heads"}, el("th", {}, "the refusing test"), el("th", {class: "narrow"}, "paths")));
  for (const g of en.refusing) r.append(el("tr", {}, el("td", {"data-label": "the refusing test"}, el("code", {}, g.test)), el("td", {"data-label": "paths"}, n(g.paths))));
  box.append(r);
  return box;
}

function sorterCard(record) {
  const card = el("div", {class: "card"});
  card.append(el("div", {class: "head"}, el("code", {}, record.entry), el("span", {class: "muted"}, `  ·  ${record.class}`)));
  const box = el("div", {class: "code"});
  record.callee.split("\n").forEach((text, i) => box.append(codeLine({sub_model: "sorter"}, String(i + 1), text, i === 0 ? "reached" : "code", () => showSorter(record), null)));
  card.append(box);
  return card;
}

function render() {
  const main = document.getElementById("main");
  main.textContent = "";
  for (const s of DATA.sub_models) {
    const section = el("section", {class: "sub"});
    section.append(el("h2", {}, swatch(s.id), s.label));
    section.append(el("div", {class: "muted"}, withCode(s.reaches)));
    if (s.id === "sorter") for (const r of DATA.sorter) section.append(sorterCard(r));
    for (const example of DATA.examples) if (example.sub_model === s.id) section.append(exampleCard(example));
    main.append(section);
  }
  main.append(unmodelledSection());
  document.documentElement.style.setProperty("--header-height", document.querySelector("header").offsetHeight + "px");
}

function unmodelledSection() {
  const section = el("section", {class: "sub", id: "unmodelled"});
  section.append(el("h2", {}, swatch("unmodelled"), "Unmodelled: every place our walker stops"));
  section.append(el("div", {class: "muted"}, `complex_signature_reader's walk over the ${n(DATA.stops_read)} builtins with custom typechecking in GNU C's list leaves a condition undecided in ${n(DATA.stops_unread)} of them, and stops ${n(DATA.stops_limited)} at its path limit. Every stop is here, where the walker itself recorded it, grouped by the limit of the walker that stops it. A condition stopped by two limits counts in both.`));
  for (const group of DATA.stops) {
    const details = el("details", {class: "limit"});
    const counts = [count(group.stops.length, "place", "places")];
    if (group.conditions) counts.push(count(group.conditions, "condition", "conditions"));
    counts.push(count(group.builtins, "builtin", "builtins"));
    details.append(el("summary", {}, el("span", {class: "lim"}, group.label), el("span", {class: "muted"}, `  ·  ${counts.join(" · ")}`)));
    const inside = el("div", {class: "inside"});
    inside.append(el("p", {class: "muted"}, withCode(group.description)));
    if (group.takes) inside.append(el("p", {}, el("b", {}, "To follow it: "), withCode(group.takes), "."));
    const table = el("table", {class: "stops"});
    table.append(el("tr", {class: "heads"}, el("th", {class: "narrow"}, "line"), el("th", {class: "wide"}, "function"), el("th", {}, "what the walk cannot work out"), el("th", {class: "narrow"}, "builtins")));
    for (const stop of group.stops) {
      const row = el("tr", {style: "cursor: pointer"}, el("td", {"data-label": "line"}, String(stop.line)), el("td", {"data-label": "function"}, el("code", {}, stop.function)), el("td", {"data-label": "what the walk cannot work out"}, el("code", {}, stop.text || "the paths of this block")), el("td", {"data-label": "builtins"}, n(stop.builtins.length)));
      row.addEventListener("click", () => showStop(group, stop));
      table.append(row);
    }
    inside.append(table);
    details.append(inside);
    section.append(details);
  }
  section.append(el("h2", {style: "margin-top: 18px", id: "untried"}, dashedSwatch("unmodelled"), "Routes GNU C takes that our holders and places never try"));
  section.append(el("div", {class: "muted"}, "Every one on this page's cards. Clang takes each for a program GNU C allows; no program of ours is one."));
  const untried = el("table", {class: "stops"});
  untried.append(el("tr", {class: "heads"}, el("th", {class: "wide"}, "entry and clang's function"), el("th", {}, "the route, and what takes it")));
  for (const u of DATA.untried) untried.append(el("tr", {}, el("td", {"data-label": "entry"}, el("code", {}, u.entry), ` · ${u.function}, ${u.file}:${u.lines[0]}`), el("td", {"data-label": "route"}, el("code", {}, u.python), " ", withCode(u.why.replace(/^not tried \(unmodelled\): /, "")))));
  section.append(untried);
  section.append(el("h2", {style: "margin-top: 18px"}, swatch("unmodelled"), "Routes our texts never take"));
  const routes = el("table", {class: "stops"});
  routes.append(el("tr", {class: "heads"}, el("th", {class: "wide"}, "text"), el("th", {class: "mid"}, "accepted"), el("th", {}, "why")));
  for (const r of DATA.never_taken) {
    const row = el("tr", {style: "cursor: pointer"}, el("td", {"data-label": "text"}, el("code", {}, r.text)), el("td", {"data-label": "accepted"}, `${n(r.accepted)} of ${n(r.programs)}`), el("td", {"data-label": "why"}, withCode(r.why)));
    row.addEventListener("click", () => showRoute(r));
    routes.append(row);
  }
  section.append(routes);
  return section;
}

function showStop(group, stop) {
  const parts = [el("h3", {}, group.label), el("p", {class: "muted"}, `clang/lib/Sema/SemaChecking.cpp:${stop.line}, in ${stop.function}`)];
  const pre = el("pre", {});
  for (const row of stop.source) pre.append(el("div", {class: row.n === stop.line ? "mark" : ""}, `${String(row.n).padStart(5)}  ${row.text}`));
  parts.push(pre);
  if (stop.text) parts.push(el("p", {}, "The walk cannot work out:"), el("div", {class: "ex"}, stop.text));
  if (stop.callee && stop.no_definition) parts.push(el("p", {}, el("code", {}, stop.callee), ": ", withCode(stop.no_definition), "."));
  else if (stop.callee) {
    parts.push(el("p", {}, `clang and LLVM define ${n(stop.definitions_count)} functions named `, el("code", {}, stop.callee), stop.definitions_count ? ":" : "."));
    for (const d of stop.definitions) parts.push(el("div", {class: "ex"}, `${d.name}  ·  ${d.file}:${d.line}`));
    if (stop.definitions_count > stop.definitions.length) parts.push(el("div", {class: "ex muted"}, `and ${n(stop.definitions_count - stop.definitions.length)} more`));
  }
  if (stop.callee && stop.defined_here && stop.limit === "on an object") parts.push(el("p", {class: "muted"}, `SemaChecking.cpp also defines a function named ${stop.callee}. Picked by its name alone, that is the one the walk would follow, whatever the object's type.`));
  if (stop.callee && stop.defined_here && stop.limit === "nested too deep") parts.push(el("p", {class: "muted"}, `SemaChecking.cpp defines a function named ${stop.callee}; the walk follows it by its name, here more than 8 calls deep.`));
  if (group.takes) parts.push(el("p", {}, el("b", {}, "To follow it: "), withCode(group.takes), "."));
  if (stop.conditions.length) {
    parts.push(el("p", {}, `It leaves undecided, in ${count(stop.builtins.length, "builtin", "builtins")}:`));
    for (const c of stop.conditions) {
      parts.push(el("pre", {}, c.text + (c.lines.length ? `\ntested at line ${c.lines.join(", ")}` : "")));
      parts.push(el("div", {class: "ex"}, c.builtins.slice(0, 40).join(", ") + (c.builtins.length > 40 ? `, and ${c.builtins.length - 40} more` : "")));
    }
  } else {
    parts.push(el("p", {}, `The walk stops its paths here, in ${count(stop.builtins.length, "builtin", "builtins")}:`), el("div", {class: "ex"}, stop.builtins.join(", ")));
  }
  panel(...parts);
}

function showPythonLine(example, line) {
  const parts = [el("h3", {}, `${example.function}`), el("pre", {}, line.text), el("p", {class: "muted"}, `clang ${example.file}, ${line.lines.length === 1 ? "line" : "lines"} ${line.lines.join(", ")}`)];
  if (line.kind === "exit") {
    const e = example.exits[line.note];
    if (e && e.programs) {
      parts.push(el("p", {}, el("b", {}, `${n(e.programs)} programs`), ` take this route to the exit “${line.note}”:`));
      for (const [p, c] of Object.entries(e.parts)) parts.push(el("div", {class: "ex"}, `${PART_LABEL[p] || p}: ${n(c)}`));
      parts.push(el("p", {class: "muted"}, "For example:"));
      for (const x of e.examples) parts.push(el("div", {class: "ex"}, `${x.holders.join(", ")}${x.instruction ? "  →  " + x.instruction : ""}`));
    } else parts.push(el("p", {}, `No program of ours makes this exit (“${line.note}”).`));
  }
  if (line.kind === "unreached") parts.push(el("p", {}, el("b", {}, "Not reached. "), withCode(line.note)));
  if (line.kind === "unmodelled") {
    parts.push(el("p", {}, el("b", {}, "Unmodelled. "), "complex_signature_reader's walk leaves this condition unread:"), el("div", {class: "ex"}, line.note));
    for (const s of line.stops || []) {
      parts.push(el("p", {}, "Our walker stops at line ", String(s.line), ": ", el("b", {}, s.label), "."), el("div", {class: "ex"}, s.text));
      if (s.takes) parts.push(el("p", {class: "muted"}, "To follow it: ", withCode(s.takes), "."));
    }
  }
  panel(...parts);
}

function showClangLine(example, row) {
  panel(el("h3", {}, `${example.file}:${row.n}`), el("pre", {}, row.text.trim() || " "), el("p", {class: "muted"}, "No line of the Python stands for this line: it sits inside a route the Python names in one line."));
}

function showExit(example, name) {
  const e = example.exits[name];
  const parts = [el("h3", {}, `${example.entry} → ${name}`), el("p", {}, `${n(e.programs)} programs.`)];
  for (const [p, c] of Object.entries(e.parts)) parts.push(el("div", {class: "ex"}, `${PART_LABEL[p] || p}: ${n(c)}`));
  for (const x of e.examples) parts.push(el("div", {class: "ex"}, `${x.holders.join(", ")}${x.instruction ? "  →  " + x.instruction : ""}`));
  if (example.places && e.examples.length) {
    for (const x of e.examples) parts.push(el("pre", {}, `${x.holders[0]}:\n` + (example.places[x.holders[0]] || []).join("\n")));
  }
  panel(...parts);
}

function showSubModel(s) {
  panel(el("h3", {}, s.label), el("p", {}, withCode(s.reaches)), el("p", {class: "muted"}, `Built ${s.built}.`), el("p", {class: "muted"}, s.code));
}

function showSorter(record) {
  panel(el("h3", {}, `${record.entry}: ${record.class}`), el("p", {}, "HiOp_sorter's record of , el("pre", {}, record.callee));
}

function showRoute(r) {
  const parts = [el("h3", {}, r.text), el("p", {}, withCode(r.why)), el("p", {}, `${n(r.accepted)} of ${n(r.programs)} programs accepted (run elv2_l183).`)];
  for (const w of r.refusals) parts.push(el("div", {class: "ex"}, `${n(w.count)} · ${w.words}`));
  panel(...parts);
}

document.getElementById("view-python").addEventListener("click", () => { view = "python"; setView(); });
document.getElementById("view-clang").addEventListener("click", () => { view = "clang"; setView(); });
document.getElementById("view-paths").addEventListener("click", () => { view = "paths"; setView(); });
function setView() {
  document.getElementById("view-python").setAttribute("aria-pressed", String(view === "python"));
  document.getElementById("view-clang").setAttribute("aria-pressed", String(view === "clang"));
  document.getElementById("view-paths").setAttribute("aria-pressed", String(view === "paths"));
  render();
}
document.getElementById("q-page").addEventListener("click", () => document.getElementById("pop-page").classList.toggle("open"));
document.getElementById("panel-close").addEventListener("click", () => document.getElementById("panel").classList.remove("open"));
document.getElementById("pop-page").textContent = ` pair has a logical path in clang's code; refusals come from compiling; every call can be followed; what stops the walk is our walker. Each card is one of clang's functions on the path of one entry, as Python (written by hand, line for line) or as clang's own C++. The entry is the HiOp as a program writes it; each exit is what clang hands LLVM. A coloured line is an exit some program of ours reaches, counted from what clang wrote for every accepted program (${DATA.command}). Grey: closed by our setup (the options our runs compile with, the language, the target, the standard form), with the reason. Red, dashed: a route GNU C takes that our holders and places never try (unmodelled). Red: our walker stops there. The last section lists every unmodelled route and every place our walker stops. "every path" lists each path the walk enumerates, where it has been run.`;
legend();
render();
</script>
</body>
